<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>
    <main class="card-cadastro">
        
        <div class="inputs_row">
            <div class="campo-input">
                <label class="label-input">Nome</label>
                <input type="text" class="input-padrao">
            </div>

            <div class="campo-input">
                <label class="label-input">E-mail</label>
                <input type="text" class="input-padrao">
            </div>
            
            <div class="campo-input">
                <label class="label-input">Cargo</label>
                <input type="text" class="input-padrao">
            </div>
        </div>

        <div class="inputs_column">
            <div class="campo-input">
                <label class="label-input">RT Vinculado</label>
                <input type="text" class="input-padrao">
            </div>
            <div class="campo-input">
                <label class="label-input">Gerente Vinculado</label>
                <input type="text" class="input-padrao">
            </div>
        </div>

        <a href="#" class="salvar">Salvar</a>

    </main>
</body>

</html>
