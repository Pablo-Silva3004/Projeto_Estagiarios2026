# ============================================
# Conexão com o banco de dados
# Edite os valores abaixo com seus dados
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/estagioof
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate
# ============================================
# none = não mexe na estrutura do banco (vc já criou as tabelas no MySQL)
spring.jpa.hibernate.ddl-auto=none

# Mostra as queries SQL no console (útil para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do MySQL 8 (o aviso de deprecated pode ser ignorado)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# O novo banco usa snake_case nos nomes das colunas (ex: criado_em, perfil_id)
# O Hibernate 6 já converte camelCase → snake_case automaticamente por padrão
# Por isso a linha de PhysicalNamingStrategyStandardImpl foi removida

# ============================================
# Jackson – formato do JSON de resposta
# Converte camelCase do Java para snake_case no JSON
# Exemplo: idFornecedor → id_fornecedor
# Isso faz o JSON bater com as interfaces do Angular
# ============================================
spring.jackson.property-naming-strategy=SNAKE_CASE

# ============================================
# SpringDoc / Swagger
# Documentação disponível em:
# http://localhost:8080/swagger-ui.html
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
mp.jwt.verify.issuer=user-service
