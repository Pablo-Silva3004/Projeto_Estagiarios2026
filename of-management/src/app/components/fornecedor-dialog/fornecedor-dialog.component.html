<div class="dialog-cabecalho">
  <div class="dialog-cabecalho-esquerda">
    <i class="fa-solid fa-store icone-titulo"></i>
    <div>
      <h2 class="dialog-titulo">{{ isNovo ? 'Novo Fornecedor' : 'Editar Fornecedor' }}</h2>
      <p class="dialog-subtitulo">{{ isNovo ? 'Preencha os dados do novo fornecedor' : fornecedor.nome }}</p>
    </div>
  </div>
  <button mat-icon-button mat-dialog-close class="btn-fechar">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="conteudo-dialog">

  <mat-form-field appearance="outline" class="campo-cheio">
    <mat-label>Nome / Razão Social</mat-label>
    <input matInput [(ngModel)]="fornecedor.nome" name="nome" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="campo-cheio">
    <mat-label>CNPJ</mat-label>
    <input matInput [(ngModel)]="fornecedor.cnpj" name="cnpj" placeholder="00.000.000/0000-00" />
  </mat-form-field>

  <div class="linha-dupla">
    <mat-form-field appearance="outline" class="campo">
      <mat-label>Telefone</mat-label>
      <input matInput [(ngModel)]="fornecedor.telefone" name="telefone" placeholder="(00) 0000-0000" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="campo">
      <mat-label>E-mail</mat-label>
      <input matInput type="email" [(ngModel)]="fornecedor.email" name="email" />
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="campo-cheio">
    <mat-label>Endereço</mat-label>
    <input matInput [(ngModel)]="fornecedor.endereco" name="endereco" />
  </mat-form-field>

  <div class="toggle-row">
    <span class="toggle-label">Fornecedor ativo</span>
    <mat-slide-toggle [(ngModel)]="fornecedor.ativo" color="primary"></mat-slide-toggle>
  </div>

</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-acoes">
  <button mat-stroked-button (click)="fechar()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="fechar()">
    <mat-icon>save</mat-icon>
    Salvar
  </button>
</mat-dialog-actions>
