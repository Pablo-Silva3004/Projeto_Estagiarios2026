<div class="pagina">

  <div class="pagina-header">
    <div>
      <h1>Usuários</h1>
      <p class="subtitulo">Usuários do sistema com seus perfis e unidades</p>
    </div>
    <button mat-flat-button color="primary" class="btn-novo" (click)="abrirNovo()">
      <mat-icon>person_add</mat-icon>
      Novo Usuário
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <table class="tabela">
        <thead>
          <tr>
            <th>#</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Unidade</th>
            <th>Perfil</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let u of usuarios">
            <td class="id-cell">{{ u.id_usuario }}</td>
            <td>
              <div class="nome-avatar">
                <div class="avatar"
                  [class.avatar-admin]="u.perfil === 'ADMIN'"
                  [class.avatar-aprovador]="u.perfil === 'APROVADOR'"
                  [class.avatar-solicitante]="u.perfil === 'SOLICITANTE'">
                  {{ u.nome.charAt(0) }}
                </div>
                <span class="nome">{{ u.nome }}</span>
              </div>
            </td>
            <td class="email-cell">{{ u.email }}</td>
            <td><span class="chip-unidade">{{ u.unidade }}</span></td>
            <td>
              <span class="badge-perfil"
                [class.perfil-admin]="u.perfil === 'ADMIN'"
                [class.perfil-aprovador]="u.perfil === 'APROVADOR'"
                [class.perfil-solicitante]="u.perfil === 'SOLICITANTE'">
                {{ u.perfil }}
              </span>
            </td>
            <td>
              <span class="badge-status" [class.badge-ativo]="u.ativo" [class.badge-inativo]="!u.ativo">
                {{ u.ativo ? 'Ativo' : 'Inativo' }}
              </span>
            </td>
            <td>
              <button mat-icon-button color="primary" (click)="abrirEdicao(u)" title="Editar usuário">
                <mat-icon>edit</mat-icon>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </mat-card-content>
  </mat-card>

</div>
