<div class="pagina">

  <div class="pagina-header">
    <div>
      <h1>Produtos</h1>
      <p class="subtitulo">Catálogo de produtos disponíveis para solicitação</p>
    </div>
    <button mat-flat-button color="primary" class="btn-novo" (click)="abrirNovo()">
      <mat-icon>add</mat-icon>
      Novo Produto
    </button>
  </div>

  <mat-card>
    <mat-card-content>
      <table class="tabela">
        <thead>
          <tr>
            <th>#</th>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Descrição</th>
            <th>Unid. Medida</th>
            <th>Preço Ref.</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of produtos">
            <td class="id-cell">{{ p.id_produto }}</td>
            <td class="nome-cell">{{ p.nome }}</td>
            <td>
              <span class="chip-categoria">{{ p.categoria }}</span>
            </td>
            <td class="descricao-cell">{{ p.descricao }}</td>
            <td class="unidade-cell">{{ p.unidade_medida }}</td>
            <td class="preco-cell">{{ p.preco_referencia }}</td>
            <td>
              <span class="badge-status" [class.badge-ativo]="p.ativo" [class.badge-inativo]="!p.ativo">
                {{ p.ativo ? 'Ativo' : 'Inativo' }}
              </span>
            </td>
            <td>
              <button mat-icon-button color="primary" (click)="abrirEdicao(p)" title="Editar produto">
                <mat-icon>edit</mat-icon>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </mat-card-content>
  </mat-card>

</div>
