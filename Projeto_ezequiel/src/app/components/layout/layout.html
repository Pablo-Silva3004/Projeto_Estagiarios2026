<div class="shell" (click)="closeProfileMenu()">
  <header class="topbar">
    <div class="topbar-left">
      <button
        type="button"
        class="icon-button"
        aria-label="Alternar menu lateral"
        (click)="$event.stopPropagation(); toggleSidebar()"
      >
        ☰
      </button>
      <div>
        <p class="system-label">App Shell</p>
        <h1>{{ systemName }}</h1>
      </div>
    </div>

    <div class="topbar-right">
      <button
        type="button"
        class="profile-button"
        (click)="$event.stopPropagation(); toggleProfileMenu()"
      >
        <span class="profile-avatar">{{ userName.charAt(0) }}</span>
        <span class="profile-info">
          <strong>{{ userName }}</strong>
          <small>{{ userRole }}</small>
        </span>
      </button>

      <div class="profile-menu" *ngIf="isProfileMenuOpen()" (click)="$event.stopPropagation()">
        <a routerLink="/meu-perfil" (click)="closeProfileMenu()">Meu Perfil</a>
        <button type="button">Sair</button>
      </div>
    </div>
  </header>

  <div class="shell-body">
    <div
      class="sidebar-backdrop"
      *ngIf="isMobileView() && isMobileMenuOpen()"
      (click)="toggleSidebar()"
    ></div>

    <aside
      class="sidebar"
      [class.collapsed]="isSidebarCollapsed() && !isMobileView()"
      [class.mobile-open]="isMobileMenuOpen()"
    >
      <div class="sidebar-header">
        <span>Navegação</span>
        <small>Preparada para controle por perfil</small>
      </div>

      <nav>
        <a
          *ngFor="let item of menuItems"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
          [class.icon-only]="isSidebarCollapsed() && !isMobileView()"
          [hidden]="!canShowItem(item.allowedRoles)"
          (click)="closeSidebarOnMobile()"
        >
          <span class="nav-icon">{{ item.icon }}</span>
          <span class="nav-text">{{ item.label }}</span>
        </a>
      </nav>
    </aside>

    <main class="content-area">
      <section class="content-card">
        <router-outlet></router-outlet>
      </section>
    </main>
  </div>
</div>
